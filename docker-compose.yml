# Backend + nginx. MySQL di-install native di VPS (bukan container).
# DB_URL di .env harus memakai host.docker.internal (bukan localhost / mysql).

services:
  backend:
    # Image is built by GitHub Actions (.github/workflows/deploy-dev.yml) and only
    # pulled on the VPS — `go build` never runs on the small dev server again.
    # `build:` stays so `docker compose up --build` / `make up` still works locally.
    image: ghcr.io/debidarmawan/progas-wms-be:development
    build:
      context: .
      dockerfile: Dockerfile
    container_name: progas-wms-be
    restart: unless-stopped
    mem_limit: 256m
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: "host"
